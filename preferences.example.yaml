market: Staten Island, NY
# Hard allow-list — only these ZIPs are admitted to the pool. Widen it to discover new
# areas, or set it to [] to fall back to zip_prefixes alone.
zips:
  - "10301"
  - "10302"
  - "10303"
  - "10304"
  - "10305"
  - "10306"
  - "10308"
  - "10309"
  - "10310"
  - "10312"
  - "10314"
zip_prefixes:
  - "103"
# The pool stores and searches up to price.max; alerts are gated separately by
# eligibility.telegram_max_price, so the band between the two is a silent watchlist —
# a listing that drops INTO alert range is caught the day it happens.
price:
  min: 550000
  max: 900000
property_types:
  - sf_attached
  - sf_detached
  - sf_semi
  - 2fam_detached
neighborhoods: []
beds_min: 3
eligibility:
  # `land` covers RentCast's "Land" lots — without it they are admitted, can never carry a
  # bath count, and sit forever in the blocked-from-alerting tally.
  excluded_property_types: [condo, apartment, lot, land]
  store_min_baths: 2
  telegram_min_baths: 2.5
  telegram_max_price: 800000
  safe_flood_zones: [X]
telegram_recipient_ids: [7512954760, 5143942438]
# Operational failure alerts (run health) go only to these owners — without this key nobody
# is alerted when a run degrades. Alerts fire on CHANGES only: new problems, resolutions,
# and a weekly still-broken reminder; the full verdict is in logs/update.log every run.
telegram_health_recipient_ids: [7512954760]
fetch_limit: 100
finance:
  rate: 0.063
  down_payment_pct: 0.20
  term_years: 30
llm:
  backend: auto            # auto = use the ladders below; or pin: codex, claude_cli, agy_cli
  # Per-job ladders. The jobs have opposite priorities, so they don't share one policy:
  # chat has a user waiting (latency wins), rank runs overnight (depth wins).
  ladders:
    chat:
      - codex              # ChatGPT subscription via the codex CLI — no API key
      - claude_cli         # Claude subscription via the claude CLI — no API key
    extract:
      - claude_cli
      - codex
    rank:
      - codex
      - claude_cli
      - agy_cli            # Gemini Pro subscription via the Antigravity CLI — no API key
  ladder:                  # fallback for any job not named above
    - codex
    - claude_cli
    # - anthropic          # Claude API; needs ANTHROPIC_API_KEY, billed per token
  timeout: 120
  available_ttl: 60        # seconds between availability probes per backend
  # Per-rung daily request caps. Each rung is a separate subscription, so a user who exhausts
  # one rolls onto the next provider's quota instead of draining a single one. Counted in
  # requests rather than tokens because codex and agy_cli report no token counts, and codex
  # answers most chat questions — a token budget would leave the busiest path unmetered.
  budgets:
    default:
      requests_per_day: 40
    system:                # batch jobs (rank, describe) get their own allowance
      requests_per_day: 200
    per_actor: {}          # '<telegram_user_id>': {requests_per_day: 200}
  backends:
    codex:
      bin: codex
      model: null          # null = whatever your codex subscription defaults to
      timeout: 120
    claude_cli:
      bin: claude
      model: haiku         # haiku | sonnet | opus — haiku is ample for a query spec
      timeout: 120
    agy_cli:
      bin: agy
      model: gemini-3.5-flash-low   # see `agy models` for the full list
      timeout: 180         # ~19s/call typical; it is the slowest rung
      retries: 2           # no --json-schema flag, so parse failures are retried
    anthropic:
      model: claude-haiku-4-5
      max_tokens: 1024
      timeout: 60
sources:
  zillow:
    every_days: 1
    # PER search URL. The nightly run posts up to two URLs — the full price range sorted
    # newest-first (every new listing seen the night it posts) plus the rotating sweep band
    # (re-sightings that catch price drops) — so the Apify charge is bounded at
    # 2 x results_limit x ~$0.0023/result. 25 keeps the worst case inside the $5/month
    # free tier; raise it only after checking the "apify:" budget line in the run report.
    results_limit: 25
  # RentCast's free tier allows 50 API calls/month and each ZIP costs one call per run, so
  # this source keeps its own 6-ZIP list rather than inheriting the wider search allow-list
  # (11 ZIPs weekly ≈ 47/month — a single backoff retry would breach the quota). Failed runs
  # retry with backoff (1d/2d/4d, capped at every_days) precisely so a transient outage
  # cannot burn the quota with daily retries.
  # Usage and the billing-cycle reset date: app.rentcast.io (API dashboard).
  rentcast:
    every_days: 7
    zips: ["10304", "10306", "10308", "10309", "10312", "10314"]
sweep:
  # 85000 splits 560915-900000 into exactly 4 even bands; 80000 would leave a degenerate
  # 19k-wide 5th band that wastes a whole night of the rotation.
  band_step: 85000
lifecycle:
  # Age a listing to off_market when it stops coming back from searches. Only searches that
  # returned FEWER results than their cap count as evidence — a run that hit the cap was cut
  # off mid-list and proves nothing (see kash/lifecycle.py). Curated rows, pending/sold rows,
  # and anything you have favorited / booked a viewing on / made an offer on are never aged.
  # A later sighting flips the row back to active and bumps times_relisted.
  enabled: true
  misses_before_off_market: 2
  max_aged_per_run: 10     # blast-radius cap; the rest wait for the next run
rank:
  max_per_run: 15
enrich:
  max_per_run: 50
detail:
  max_per_run: 10        # $0.0036/result; 10 covers the 2-7 new listings/day without queueing
describe:
  max_per_run: 15        # LLM description signals per run; idempotent, one call per new row
schools:
  # Zoned elementary school from frozen NYC DOE polygons (kash/data/si_school_zones.json).
  # Offline and free, so the cap is only there to bound one run's writes; blanks are filled,
  # hand-entered names are never overwritten. Rebuild the asset each school year with
  # scripts/build_school_zones.py.
  max_per_run: 200
